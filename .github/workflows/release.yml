# Builds, tests and publishes a release for the version in CMakeLists.txt. Run by hand only.
name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Draft release
        type: boolean
        default: false
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

# The release token publishes, so the workflow's own token only reads.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Verify the release account
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the RELEASE_TOKEN Actions secret to a Dreambjorn personal access token"
            exit 1
          fi
          publisher=$(gh api user --jq .login)
          if [ "$publisher" != 'Dreambjorn' ]; then
            echo "::error::RELEASE_TOKEN must belong to Dreambjorn"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the version check
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(LumenShot VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          # The executable's own version resource must agree, or the release lies about its file.
          grep -qF "\"ProductVersion\", \"$version\\0\"" src/app.rc \
            || { echo "::error::src/app.rc does not say version $version"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already tagged; raise the version first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cmake --preset release && cmake --build --preset release

      # Hosted runners have no real display, so the live screen-capture tests stay local.
      - name: Test
        run: ctest --preset release --exclude-regex '^(platform_tests|multimonitor_tests)$'

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          sha256=$(sha256sum build/LumenShot.exe | cut -d' ' -f1)
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f "tag_name=$RELEASE_TAG" \
            -f "target_commitish=$GITHUB_SHA" \
            --jq .body > "$notes_file"
          {
            printf '\n## SHA256\n\n'
            printf '| File | SHA256 |\n| --- | --- |\n'
            printf '| LumenShot.exe | `%s` |\n' "$sha256"
          } >> "$notes_file"
          flags=()
          if [ "$DRAFT" = 'true' ]; then flags+=(--draft); fi
          if [ "$PRERELEASE" = 'true' ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" build/LumenShot.exe \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "LumenShot $RELEASE_TAG" \
            --notes-file "$notes_file" \
            "${flags[@]}"
